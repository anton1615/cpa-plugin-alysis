name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Cross build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    container: golang:1.26-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            cc: gcc
          - os: linux
            arch: arm64
            cc: aarch64-linux-gnu-gcc
          - os: windows
            arch: amd64
            cc: x86_64-w64-mingw32-gcc
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CC: ${{ matrix.cc }}
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install packaging and cross-compilation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make zip binutils curl ca-certificates
          if [[ "$GOOS/$GOARCH" == linux/arm64 ]]; then
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi
          if [[ "$GOOS" == windows ]]; then
            apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          fi
      - name: Build
        run: |
          mkdir -p build
          go build -trimpath -buildvcs=false -buildmode=c-shared -o "build/alysis.${{ matrix.os == 'windows' && 'dll' || 'so' }}" .
      - name: Test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test ./...
      - name: Package
        run: |
          bash scripts/package.sh "${{ github.ref_name }}" "${{ matrix.arch }}" \
            "build/alysis.${{ matrix.os == 'windows' && 'dll' || 'so' }}" dist "${{ matrix.os }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alysis-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip

  build-darwin:
    name: Build darwin ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    env:
      CGO_ENABLED: '1'
      GOOS: darwin
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Build
        run: |
          mkdir -p build
          go build -trimpath -buildvcs=false -buildmode=c-shared -o build/alysis.dylib .
      - name: Package
        run: |
          bash scripts/package.sh "${{ github.ref_name }}" "${{ matrix.arch }}" \
            build/alysis.dylib dist darwin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alysis-darwin-${{ matrix.arch }}
          path: dist/*.zip

  release:
    name: Publish release
    needs: [build, build-darwin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
